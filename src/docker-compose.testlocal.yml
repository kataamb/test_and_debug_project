services:
  adverts_db:
    image: postgres:16-alpine
    container_name: adverts_db_tests_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: adverts_db
    ports:
      - "5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./tests/test_data/db_scripts/create_tables_and_copy_data.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d adverts_db"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
    name: adverts_postgres_data
