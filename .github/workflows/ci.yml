name: CI/CD Pipeline - Lab 2

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore Allure history for Trend chart
        uses: actions/cache@v4
        with:
          path: src/allure-history
          key: allure-history-${{ github.run_number }}
          restore-keys: |
            allure-history-

      - name: Prepare allure-results directory
        run: |
          mkdir -p src/allure-results
          if [ -d "src/allure-history/history" ]; then
            cp -r src/allure-history/history src/allure-results/history
          fi

      - name: Start PostgreSQL and Backend containers
        working-directory: src
        run: |
          docker compose -f docker-compose.test.yaml up -d --build adverts_db app_test

      - name: Stage 1 - Run Unit Tests (5 workers)
        id: unit
        working-directory: src
        run: |
          docker compose -f docker-compose.test.yaml run --rm tests \
            pytest tests/unit -n 5 -v --alluredir=/app/allure-results

      - name: Stage 2 - Run Integration Tests (5 workers)
        id: integration
        if: success()
        working-directory: src
        run: |
          docker compose -f docker-compose.test.yaml run --rm tests \
            pytest tests/integration -n 5 -v --alluredir=/app/allure-results

      - name: Stage 3 - Run E2E Tests (5 parallel developers)
        id: e2e
        if: success()
        working-directory: src
        run: |
          docker compose -f docker-compose.test.yaml run --rm tests \
            pytest tests/e2e -n 5 --dist=worksteal -v --alluredir=/app/allure-results

      - name: Generate Allure Report with Trend
        if: always()
        run: |
          ALLURE_VERSION="2.32.0"
          curl -sL "https://github.com{ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" -o allure.tgz
          tar -xzf allure.tgz -C /opt/
          sudo ln -sf /opt/allure-${ALLURE_VERSION}/bin/allure /usr/local/bin/allure
          allure generate src/allure-results -o src/allure-report --clean
          mkdir -p src/allure-history
          rm -rf src/allure-history/history
          cp -r src/allure-report/history src/allure-history/history
      

      - name: Upload Allure Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ github.run_number }}
          path: src/allure-report

      - name: Stop containers
        if: always()
        working-directory: src
        run: |
          docker compose -f docker-compose.test.yaml down -v
